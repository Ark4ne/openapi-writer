name: CI

on:
  # Branches are covered by their pull request: pushing to one does not run the matrix twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library has no runtime dependency: the lowest versions would only test the development tools.
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: vendor/bin/phpunit

  static:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  coverage:
    name: Coverage (minimum 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=build/coverage/clover.xml

      - name: Check minimum coverage
        run: php bin/coverage-check.php build/coverage/clover.xml 95

      # Feeds the coverage badge of the README; an upload failure never fails the CI.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mutation:
    name: Mutation testing (minimum 85% MSI)
    runs-on: ubuntu-latest
    # Blocking on main, informative on other branches.
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: infection

      - uses: ramsey/composer-install@v3

      - name: Infection
        run: infection --threads=max --no-progress --show-mutations

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Composer audit
        run: composer audit
